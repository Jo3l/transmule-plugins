---
# Definición propia para TransMule — autoría original, escrita a mano.
# Indexer: ImmortalSeed (immortalseed) — migrado del indexer C# de Jackett
# (IndexerBase) a YAML Cardigann para el motor indexerr.
# NOTA: este indexer NO tiene YAML oficial en Jackett (solo C#).
# HTML privado: login takelogin.php + browse.php (tabla sortabletable).
id: immortalseed
name: ImmortalSeed
description: ImmortalSeed (iS) is a Private Torrent Tracker for MOVIES / TV / GENERAL
language: en-US
type: private
encoding: UTF-8
links:
  - https://immortalseed.me/
caps:
  categorymappings:
    - {id: 3, cat: Other, desc: "Nuked"}
