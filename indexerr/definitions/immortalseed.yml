    - {id: 59, cat: Movies/UHD, desc: "Movies-4k"}
    - {id: 60, cat: Movies/Foreign, desc: "Non-English 4k Movies"}
    - {id: 16, cat: Movies/HD, desc: "Movies HD"}
    - {id: 18, cat: Movies/Foreign, desc: "Movies HD Non-English"}
    - {id: 17, cat: Movies/SD, desc: "TS/CAM/PPV"}
    - {id: 34, cat: Movies/Foreign, desc: "Movies Low Def Non-English"}
    - {id: 62, cat: Movies, desc: "Movies-Packs"}
    - {id: 14, cat: Movies/SD, desc: "Movies-SD"}
    - {id: 33, cat: Movies/Foreign, desc: "Movies SD Non-English"}
    - {id: 30, cat: Audio, desc: "Music"}
    - {id: 37, cat: Audio/Lossless, desc: "FLAC"}
    - {id: 36, cat: Audio/MP3, desc: "MP3"}
    - {id: 39, cat: Audio, desc: "Music Other"}
    - {id: 38, cat: Audio/Video, desc: "Music Video"}
    - {id: 45, cat: Other, desc: "Other"}
    - {id: 7, cat: TV/Sport, desc: "Sports Tv"}
    - {id: 44, cat: TV/Sport, desc: "Sports Fitness-Instructional"}
    - {id: 58, cat: TV/Sport, desc: "Olympics"}
    - {id: 67, cat: TV/Sport, desc: "World Cup"}
    - {id: 47, cat: TV/SD, desc: "TV - 480p"}
    - {id: 64, cat: TV/UHD, desc: "TV - 4K"}
    - {id: 8, cat: TV/HD, desc: "TV - High Definition"}
    - {id: 48, cat: TV/SD, desc: "TV - SD x264"}
    - {id: 9, cat: TV/SD, desc: "TV - SD XviD"}
