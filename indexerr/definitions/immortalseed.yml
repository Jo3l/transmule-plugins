    - {id: 6, cat: TV/SD, desc: "TV Season Packs - SD"}
  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q]
    music-search: [q]
    book-search: [q]
settings:
  - name: username
    type: text
    label: Username
    required: true
  - name: password
    type: password
    label: Password
    required: true
search:
  paths:
    - path: browse.php
      method: get
      inputs:
        category: "0"
        include_dead_torrents: "yes"
        sort: seeders
        order: desc
        do: search
        keywords: "{{ .Keywords }}"
        search_type: t_name
  rows:
    selector: "#sortabletable tr:has(a[href*=\"details.php?id=\"]):has(a[href*=\"download.php\"])"
  fields:
    title:
      selector: .tooltip-content > div:nth-of-type(1)
    download:
      selector: a[href*="download.php"]
      attribute: href
    size:
      selector: td:nth-of-type(5)
      filters:
        - name: trim
    seeders:
      selector: td:nth-of-type(7)
      filters:
        - name: trim
    leechers:
      selector: td:nth-of-type(8)
      filters:
        - name: trim
login:
  path: takelogin.php
  method: POST
  inputs:
    username: "{{ .Config.username }}"
    password: "{{ .Config.password }}"