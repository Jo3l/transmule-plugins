---
# Definición propia para TransMule — autoría original, escrita a mano.
# Indexer: AnimeZ (animez) — migrado del indexer C# de Jackett
# (AvistazTracker) a YAML Cardigann para el motor indexerr.
# NOTA: este indexer NO tiene YAML oficial en Jackett (solo C#).
# API JSON: POST /api/v1/jackett/auth {username,password,pid} → {token};
# las búsquedas van con header Authorization: Bearer <token>.
# Variante: usa release_title como título cuando está presente.
id: animez
name: AnimeZ
description: AnimeZ (ex-AnimeTorrents) is a Private Torrent Tracker for ANIME / MANGA
language: en-US
type: private
encoding: UTF-8
links:
  - https://animez.to/
legacylinks:
  - https://animetorrents.me/
caps:
  categorymappings:
    - {id: "TV", cat: TV/Anime, desc: "Anime > TV"}
    - {id: "TV_SHORT", cat: TV/Anime, desc: "Anime > TV Short"}
    - {id: "MOVIE", cat: Movies, desc: "Anime > Movie"}
    - {id: "SPECIAL", cat: TV/Anime, desc: "Anime > Special"}
    - {id: "OVA", cat: TV/Anime, desc: "Anime > OVA"}
    - {id: "ONA", cat: TV/Anime, desc: "Anime > ONA"}
    - {id: "MUSIC", cat: TV/Anime, desc: "Anime > Music"}
    - {id: "MANGA", cat: Books, desc: "Manga > Manga"}
    - {id: "NOVEL", cat: Books, desc: "Manga > Novel"}
    - {id: "ONE_SHOT", cat: Books, desc: "Manga > One-Shot"}
  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q]
    book-search: [q]
settings:
  - name: username
    type: text
    label: Username
    required: true
  - name: password
    type: password
    label: Password
    required: true
  - name: pid
    type: text
    label: PID (PassID)
    required: true
search:
  headers:
    Accept: application/json
    Authorization: "Bearer {{ .Token }}"
  paths:
    - path: api/v1/jackett/torrents
      method: get
      response:
        type: json
      inputs:
        limit: "50"
        search: "{{ .Keywords }}"
  rows:
    selector: data
  fields:
    file_name:
      selector: file_name
    release_title:
      selector: release_title
    title:
      text: "{{ if .Result.release_title }}{{ .Result.release_title }}{{ else }}{{ .Result.file_name }}{{ end }}"
    size:
      selector: file_size
    seeders:
      selector: seed
    leechers:
      selector: leech
    date:
      selector: created_at_iso
    infohash:
      selector: info_hash
    download:
      selector: download
login:
  path: api/v1/jackett/auth
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  inputs:
    username: "{{ .Config.username }}"
    password: "{{ .Config.password }}"
    pid: "{{ .Config.pid }}"
  response:
    tokenPath: token