---
# Definición propia para TransMule — autoría original, escrita a mano.
# Indexer: MejorTorrent (mejortorrent) — migrado del indexer C# de Jackett
# (IndexerBase) a YAML Cardigann para el motor indexerr.
# NOTA: este indexer NO tiene YAML oficial en Jackett (solo C#).
# HTML público (Tailwind): busqueda/page/1?q=<query>; el C# recorre N páginas,
# aquí solo la primera (validado el patrón de filas).
id: mejortorrent
name: MejorTorrent
description: MejorTorrent is a Public site - Hay veces que un torrent viene mejor! :)
language: es-ES
type: public
encoding: UTF-8
links:
  - https://www44.mejortorrent.eu/
caps:
  categorymappings:
    - {id: 1, cat: Movies, desc: "Pelicula"}
    - {id: 2, cat: TV/SD, desc: "Serie"}
    - {id: 3, cat: TV/HD, desc: "Serie HD"}
    - {id: 4, cat: Audio, desc: "Musica"}
  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q]
    music-search: [q]
settings: []
search:
  paths:
    - path: "busqueda/page/1"
      method: get
      inputs:
        q: "{{ .Keywords }}"
  rows:
    selector: .w-11\/12 > div
  fields:
    title:
      selector: div:nth-of-type(1) a
      filters:
        - name: re_replace
          args: ["\\s*\\b(?:1080p|720p|2160p|4k|HDTV|WEB-DL|WEBRip|BluRay|BRrip|DVDRip|HDRip)\\b\\s*$", ""]
        - name: trim
    download:
      selector: div:nth-of-type(1) a
      attribute: href