---
# Definición propia para TransMule — autoría original, escrita a mano.
# Indexer: XSpeeds (xspeeds) — migrado del indexer C# de Jackett
# (IndexerBase) a YAML Cardigann para el motor indexerr.
# NOTA: este indexer NO tiene YAML oficial en Jackett (solo C#).
# HTML privado: login takelogin.php + browse.php (POST, tabla sortabletable).
id: xspeeds
name: XSpeeds
description: XSpeeds (XS) is a Private Torrent Tracker for MOVIES / TV / GENERAL
language: en-US
type: private
encoding: UTF-8
links:
  - https://www.xspeeds.eu/
caps:
  categorymappings:
    - {id: 70, cat: TV/Anime, desc: "Anime"}
    - {id: 113, cat: TV/Anime, desc: "Anime Boxset"}
    - {id: 112, cat: Movies, desc: "Anime Movie"}
    - {id: 111, cat: TV/Anime, desc: "Anime TV"}
    - {id: 150, cat: PC, desc: "Apps"}
    - {id: 166, cat: PC/Mac, desc: "Apps MacOS"}
    - {id: 153, cat: Books, desc: "Books"}
    - {id: 154, cat: Audio/Audiobook, desc: "Books Audio"}
    - {id: 155, cat: Books, desc: "Books eBooks & Comics"}
    - {id: 156, cat: Books, desc: "Books Magazines"}
    - {id: 152, cat: Other, desc: "Boxsets"}
    - {id: 151, cat: Other, desc: "Covers"}
    - {id: 169, cat: TV/Documentary, desc: "Documentary"}
    - {id: 158, cat: TV/Sport, desc: "Sport"}
    - {id: 157, cat: Audio, desc: "Music"}
    - {id: 159, cat: Audio/Video, desc: "Music Videos"}
    - {id: 160, cat: Audio/Lossless, desc: "Lossless"}
    - {id: 163, cat: Movies/UHD, desc: "Movies 4K"}
    - {id: 164, cat: Movies/HD, desc: "Movies Bluray"}
    - {id: 165, cat: Movies/HD, desc: "Movies Remux"}
    - {id: 161, cat: Movies/HD, desc: "Movies HD"}
    - {id: 162, cat: Movies/SD, desc: "Movies SD"}
    - {id: 168, cat: TV/UHD, desc: "TV 4K"}
    - {id: 117, cat: TV/HD, desc: "TV HD"}
    - {id: 118, cat: TV/SD, desc: "TV SD"}
    - {id: 119, cat: TV, desc: "TV Boxset"}
    - {id: 173, cat: XXX, desc: "XXX"}
  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q, imdbid]
settings:
  - name: username
    type: text
    label: Username
    required: true
  - name: password
    type: password
    label: Password
    required: true
search:
  paths:
    - path: browse.php
      method: post
      inputs:
        do: search
        category: "0"
        include_dead_torrents: "yes"
        sort: seeders
        order: desc
        keywords: "{{ .Keywords }}"
        search_type: t_name
  rows:
    selector: "table#sortabletable > tbody > tr:has(div > a[href*=\"details.php?id=\"])"
  fields:
    title:
      selector: div > a[href*="details.php?id="]
      filters:
        - name: trim
    download:
      selector: td:nth-of-type(3) a
      attribute: href
    size:
      selector: td:nth-of-type(5)
      filters:
        - name: trim
    seeders:
      selector: td:nth-of-type(7)
      filters:
        - name: trim
    leechers:
      selector: td:nth-of-type(8)
      filters:
        - name: trim
login:
  path: takelogin.php
  method: POST
  inputs:
    username: "{{ .Config.username }}"
    password: "{{ .Config.password }}"