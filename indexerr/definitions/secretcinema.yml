---
# Definición propia para TransMule — autoría original, escrita a mano.
# Indexer: Secret Cinema (secretcinema) — migrado del indexer C# de Jackett
# (GazelleTracker) a YAML Cardigann para el motor indexerr.
# NOTA: este indexer NO tiene YAML oficial en Jackett (solo C#).
# El C# prioriza releaseName cuando incluye año; si no, usa el título
# compuesto groupName (year) media.
id: secretcinema
name: Secret Cinema
description: Secret Cinema is a Private ratioless site for rare MOVIES.
language: en-US
type: private
encoding: UTF-8
links:
  - https://secret-cinema.pw/
caps:
  categorymappings:
    - {id: 1, cat: Movies, desc: "Movies"}
    - {id: 2, cat: Audio, desc: "Music"}
  modes:
    search: [q]
    movie-search: [q, imdbid]
    music-search: [q, artist, album]
settings:
  - name: username
    type: text
    label: Username
    required: true
  - name: password
    type: password
    label: Password
    required: true
search:
  paths:
    - path: ajax.php
      method: get
      response:
        type: json
      inputs:
        action: browse
        order_by: time
        order_way: desc
        searchstr: "{{ .Keywords }}"
  rows:
    selector: response.results
    attribute: torrents
    multiple: true
  fields:
    groupname:
      selector: ..groupName
      filters:
        - name: html_decode
    groupyear:
      selector: ..groupYear
    media:
      selector: media
    releasename:
      selector: releaseName
      filters:
        - name: trim
        - name: html_decode
    torrentid:
      selector: torrentId
    title:
      text: "{{ if .Result.releasename }}{{ .Result.releasename }}{{ else }}{{ .Result.groupname }} ({{ .Result.groupyear }}) {{ .Result.media }}{{ end }}"
      filters:
        - name: re_replace
          args: ["\\bBDMV\\b", "COMPLETE BLURAY"]
        - name: re_replace
          args: ["\\bSD\\b", "DVDRip"]
    size:
      selector: size
    seeders:
      selector: seeders
    leechers:
      selector: leechers
    date:
      selector: time
    download:
      text: "ajax.php?action=download&id={{ .Result.torrentid }}"
login:
  path: login.php
  method: POST
  inputs:
    username: "{{ .Config.username }}"
    password: "{{ .Config.password }}"
    keeplogged: "1"