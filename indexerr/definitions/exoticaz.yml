---
# Definición propia para TransMule — autoría original, escrita a mano.
# Indexer: ExoticaZ (exoticaz) — migrado del indexer C# de Jackett
# (AvistazTracker) a YAML Cardigann para el motor indexerr.
# NOTA: este indexer NO tiene YAML oficial en Jackett (solo C#).
# API JSON: POST /api/v1/jackett/auth {username,password,pid} → {token};
# las búsquedas van con header Authorization: Bearer <token>.
id: exoticaz
name: ExoticaZ
description: ExoticaZ (YourExotic) is a Private Torrent Tracker for 3X
language: en-US
type: private
encoding: UTF-8
links:
  - https://exoticaz.to/
caps:
  categorymappings:
    - {id: 1, cat: XXX, desc: "Video Clip"}
    - {id: 2, cat: XXX, desc: "Video Pack"}
    - {id: 3, cat: XXX, desc: "Siterip Pack"}
    - {id: 4, cat: XXX, desc: "Pornstar Pack"}
    - {id: 5, cat: XXX, desc: "DVD"}
    - {id: 6, cat: XXX, desc: "BluRay"}
    - {id: 7, cat: XXX, desc: "Photo Pack"}
    - {id: 8, cat: XXX, desc: "Books & Magazines"}
  modes:
    search: [q]
settings:
  - name: username
    type: text
    label: Username
    required: true
  - name: password
    type: password
    label: Password
    required: true
  - name: pid
    type: text
    label: PID (PassID)
    required: true
search:
  headers:
    Accept: application/json
    Authorization: "Bearer {{ .Token }}"
  paths:
    - path: api/v1/jackett/torrents
      method: get
      response:
        type: json
      inputs:
        in: "1"
        limit: "50"
        search: "{{ .Keywords }}"
  rows:
    selector: data
  fields:
    file_name:
      selector: file_name
    title:
      selector: file_name
    size:
      selector: file_size
    seeders:
      selector: seed
    leechers:
      selector: leech
    date:
      selector: created_at_iso
    infohash:
      selector: info_hash
    download:
      selector: download
login:
  path: api/v1/jackett/auth
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  inputs:
    username: "{{ .Config.username }}"
    password: "{{ .Config.password }}"
    pid: "{{ .Config.pid }}"
  response:
    tokenPath: token