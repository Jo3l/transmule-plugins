---
# Definición propia para TransMule — autoría original, escrita a mano.
# Indexer: SpeedApp (speedapp) — migrado del indexer C# de Jackett
# (SpeedAppTracker) a YAML Cardigann para el motor indexerr.
# NOTA: este indexer NO tiene YAML oficial en Jackett (solo C#).
# API JSON: POST /api/login {username,password} → {token}; las búsquedas
# van con header Authorization: Bearer <token>; la respuesta es un array.
id: speedapp
name: SpeedApp
description: SpeedApp is a ROMANIAN Private Torrent Tracker for MOVIES / TV / GENERAL
language: ro-RO
type: private
encoding: UTF-8
links:
  - https://speedapp.io/
legacylinks:
  - https://www.icetorrent.org/
  - https://icetorrent.org/
  - https://scenefz.me/
caps:
  categorymappings:
    - {id: 38, cat: Movies, desc: "Movie Packs"}
    - {id: 10, cat: Movies/SD, desc: "Movies: SD"}
    - {id: 35, cat: Movies/SD, desc: "Movies: SD Ro"}
    - {id: 8, cat: Movies/HD, desc: "Movies: HD"}
    - {id: 29, cat: Movies/HD, desc: "Movies: HD Ro"}
    - {id: 7, cat: Movies/DVD, desc: "Movies: DVD"}
    - {id: 2, cat: Movies/DVD, desc: "Movies: DVD Ro"}
    - {id: 17, cat: Movies/BluRay, desc: "Movies: BluRay"}
    - {id: 24, cat: Movies/BluRay, desc: "Movies: BluRay Ro"}
    - {id: 59, cat: Movies, desc: "Movies: Ro"}
    - {id: 57, cat: Movies/UHD, desc: "Movies: 4K (2160p)"}
    - {id: 61, cat: Movies/UHD, desc: "Movies: 4K Ro"}
    - {id: 41, cat: TV, desc: "TV Packs"}
    - {id: 66, cat: TV, desc: "TV Packs Ro"}
    - {id: 45, cat: TV/SD, desc: "TV Episodes"}
    - {id: 46, cat: TV/SD, desc: "TV Episodes Ro"}
    - {id: 43, cat: TV/HD, desc: "TV Episodes HD"}
    - {id: 44, cat: TV/HD, desc: "TV Episodes HD Ro"}
    - {id: 60, cat: TV, desc: "TV Ro"}
    - {id: 11, cat: PC/Games, desc: "Games: PC-ISO"}
    - {id: 52, cat: Console, desc: "Games: Console"}
    - {id: 1, cat: PC/0day, desc: "Applications"}
    - {id: 14, cat: PC, desc: "Applications: Linux"}
    - {id: 37, cat: PC/Mac, desc: "Applications: Mac"}
    - {id: 19, cat: PC/Mobile, desc: "Applications: Mobile"}
  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q, imdbid]
settings:
  - name: username
    type: text
    label: Email
    required: true
  - name: password
    type: password
    label: Password
    required: true
search:
  headers:
    Authorization: "Bearer {{ .Token }}"
  paths:
    - path: api/torrent
      method: get
      response:
        type: json
      inputs:
        itemsPerPage: "100"
        includingDead: "1"
        sort: torrent.createdAt
        direction: desc
        search: "{{ .Keywords }}"
  rows:
    selector: ""
  fields:
    title:
      selector: name
      filters:
        - name: re_replace
          args: ["\\[REQUEST(ED)?\\]", ""]
        - name: trim
    torrentid:
      selector: id
    size:
      selector: size
    seeders:
      selector: seeders
    leechers:
      selector: leechers
    date:
      selector: created_at
    download:
      text: "/api/torrent/{{ .Result.torrentid }}/download"
login:
  path: api/login
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  inputs:
    username: "{{ .Config.username }}"
    password: "{{ .Config.password }}"
  response:
    tokenPath: token