---
# Definición propia para TransMule — autoría original, escrita a mano.
# Indexer: Torrent Network (torrentnetwork) — migrado del indexer C# de
# Jackett (IndexerBase) a YAML Cardigann para el motor indexerr.
# NOTA: este indexer NO tiene YAML oficial en Jackett (solo C#).
# API JSON con token: POST api/auth {username,password} → {token}; el browse
# devuelve {data: [[…],…]} con cada fila como ARRAY de columnas (índices).
# El passkey del download se obtiene en C# vía api/curuser (multi-paso) — aquí
# se configura manualmente (copy de tu perfil en el sitio).
id: torrentnetwork
name: Torrent Network
description: Torrent Network (TN) is a GERMAN Private site for TV / MOVIES / GENERAL
language: de-DE
type: private
encoding: UTF-8
links:
  - https://tntracker.org/
caps:
  categorymappings:
    - {id: 24, cat: Movies/SD, desc: "Movies GER/SD"}
    - {id: 18, cat: Movies/HD, desc: "Movies GER/720p"}
    - {id: 17, cat: Movies/HD, desc: "Movies GER/1080p"}
    - {id: 20, cat: Movies/UHD, desc: "Movies GER/2160p"}
    - {id: 45, cat: Movies, desc: "Movies GER/Remux"}
    - {id: 19, cat: Movies/BluRay, desc: "Movies GER/BluRay"}
    - {id: 34, cat: TV/Anime, desc: "Movies GER/Anime"}
    - {id: 36, cat: Movies/3D, desc: "Movies GER/3D"}
    - {id: 22, cat: Movies/SD, desc: "Movies ENG/SD"}
    - {id: 35, cat: Movies/HD, desc: "Movies ENG/720p"}
    - {id: 43, cat: Movies/HD, desc: "Movies ENG/1080p"}
    - {id: 48, cat: Movies/UHD, desc: "Movies ENG/2160p"}
    - {id: 46, cat: Movies, desc: "Movies ENG/Remux"}
    - {id: 38, cat: Movies/BluRay, desc: "Movies ENG/BluRay"}
    - {id: 39, cat: TV/Anime, desc: "Movies ENG/Anime"}
    - {id: 27, cat: TV/SD, desc: "Series GER/SD"}
    - {id: 28, cat: TV/HD, desc: "Series GER/HD"}
    - {id: 2, cat: TV/Anime, desc: "Series GER/Anime"}
    - {id: 16, cat: TV, desc: "Series GER/Pack"}
    - {id: 6, cat: TV/Documentary, desc: "Docu/SD"}
    - {id: 7, cat: TV/Documentary, desc: "Docu/HD"}
    - {id: 29, cat: TV/SD, desc: "Series ENG/SD"}
    - {id: 40, cat: TV/HD, desc: "Series ENG/HD"}
    - {id: 41, cat: TV/Anime, desc: "Series ENG/Anime"}
    - {id: 42, cat: TV, desc: "Series ENG/Pack"}
    - {id: 31, cat: TV/Sport, desc: "Sport"}
    - {id: 10, cat: PC/Games, desc: "Games/Win"}
    - {id: 12, cat: Console, desc: "Games/Wii"}
    - {id: 13, cat: Console, desc: "Games/PSX"}
    - {id: 14, cat: Console, desc: "Games/XBOX"}
    - {id: 4, cat: PC/Mac, desc: "Apps/Mac"}
    - {id: 5, cat: PC/0day, desc: "Apps/Win"}
    - {id: 1, cat: Audio/Audiobook, desc: "Misc/aBook"}
    - {id: 8, cat: Books, desc: "Misc/eBook"}
    - {id: 30, cat: Other, desc: "Misc/Sonstiges"}
    - {id: 44, cat: Audio/Lossless, desc: "Musik/Flac"}
    - {id: 25, cat: Audio/MP3, desc: "Musik/MP3"}
    - {id: 26, cat: Audio/Video, desc: "Musik/Video"}
    - {id: 32, cat: XXX, desc: "XXX/XXX"}
    - {id: 33, cat: XXX, desc: "XXX/XXX|HD"}
  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q]
    music-search: [q]
    book-search: [q]
settings:
  - name: username
    type: text
    label: Username
    required: true
  - name: password
    type: password
    label: Password
    required: true
  - name: passkey
    type: password
    label: Passkey (de tu perfil del sitio)
    required: true
search:
  headers:
    Authorization: "{{ .Token }}"
  paths:
    - path: api/browse
      method: get
      response:
        type: json
      inputs:
        orderC: "4"
        orderD: desc
        start: "0"
        length: "100"
        search: "{{ .Keywords }}"
  rows:
    selector: data
  fields:
    torrentid:
      selector: "[2]"
    title:
      selector: "[1]"
    size:
      selector: "[5]"
    seeders:
      selector: "[6]"
    leechers:
      selector: "[7]"
    date:
      selector: "[3]"
    download:
      text: "/sdownload/{{ .Result.torrentid }}/{{ .Config.passkey }}"
login:
  path: api/auth
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  inputs:
    username: "{{ .Config.username }}"
    password: "{{ .Config.password }}"
  response:
    tokenPath: token