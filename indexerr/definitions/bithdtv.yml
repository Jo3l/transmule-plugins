---
# Definición propia para TransMule — autoría original, escrita a mano.
# Indexer: BIT-HDTV (bithdtv) — migrado del indexer C# de Jackett (IndexerBase)
# a YAML Cardigann para el motor indexerr.
# NOTA: este indexer NO tiene YAML oficial en Jackett (solo C#).
# HTML privado con COOKIE: torrents.php?search=<q>&options=0; la tabla
# #torrents-index-table tiene columnas: cat, name, files, date, size, seed, leech.
# OJO: BIT-HDTV tiene rate limits — el indexer fallará si se exceden.
id: bithdtv
name: BIT-HDTV
description: BIT-HDTV is a Private site - Home of High Definition
language: en-US
type: private
encoding: UTF-8
links:
  - https://www.bit-hdtv.com/
caps:
  categorymappings:
    - {id: 1, cat: Movies/HD, desc: "HD Movies"}
    - {id: 2, cat: TV/HD, desc: "HD TV"}
  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q, imdbid]
settings:
  - name: cookie
    type: text
    label: Cookie (de tu navegador, sesión logueada)
    required: true
search:
  headers:
    Cookie: "{{ .Config.cookie }}"
  paths:
    - path: torrents.php
      method: get
      inputs:
        search: "{{ .Keywords }}"
        options: "0"
  rows:
    selector: "#torrents-index-table > #torrents-index-table-body > tr:has(a[href^=\"download.php\"])"
  fields:
    title:
      selector: td:nth-of-type(3) a
      attribute: title
      filters:
        - name: re_replace
          args: ["\\.", " "]
        - name: trim
    download:
      selector: a[href^="download.php"]
      attribute: href
      filters:
        - name: re_replace
          args: ["^/", ""]
        - name: prepend
          args: ["{{ .Config.sitelink }}"]
    size:
      selector: td:nth-of-type(7)
      filters:
        - name: trim
    seeders:
      selector: td:nth-of-type(9)
      filters:
        - name: trim
    leechers:
      selector: td:nth-of-type(10)
      filters:
        - name: trim
    date:
      selector: td:nth-of-type(6)
      filters:
        - name: trim