---
# Definición propia para TransMule — autoría original, escrita a mano.
# Indexer: TorrentDay (torrentday) — migrado del indexer C# de Jackett
# (IndexerBase) a YAML Cardigann para el motor indexerr.
# NOTA: este indexer NO tiene YAML oficial en Jackett (solo C#).
# API JSON con COOKIE (no login por password): t.json?<cats>;q=<query>.
id: torrentday
name: TorrentDay
description: TorrentDay (TD) is a Private site for TV / MOVIES / GENERAL
language: en-US
type: private
encoding: UTF-8
links:
  - https://tday.love/
caps:
  categorymappings:
    - {id: 96, cat: Movies/UHD, desc: "Movie/4K"}
    - {id: 11, cat: Movies/BluRay, desc: "Movies/Bluray"}
    - {id: 5, cat: Movies/BluRay, desc: "Movies/Bluray-Full"}
    - {id: 103, cat: Movies/SD, desc: "Movies/Cam"}
    - {id: 3, cat: Movies/DVD, desc: "Movies/DVD-R"}
    - {id: 21, cat: Movies/SD, desc: "Movies/MP4"}
    - {id: 22, cat: Movies/Foreign, desc: "Movies/Non-English"}
    - {id: 13, cat: Movies, desc: "Movies/Packs"}
    - {id: 44, cat: Movies/SD, desc: "Movies/SD/x264"}
    - {id: 48, cat: Movies, desc: "Movies/x265"}
    - {id: 1, cat: Movies/SD, desc: "Movies/XviD"}
    - {id: 24, cat: TV/SD, desc: "TV/480p"}
    - {id: 104, cat: TV/UHD, desc: "TV/4K"}
    - {id: 32, cat: TV/HD, desc: "TV/Bluray"}
    - {id: 31, cat: TV/SD, desc: "TV/DVD-R"}
    - {id: 33, cat: TV/SD, desc: "TV/DVD-Rip"}
    - {id: 46, cat: TV/SD, desc: "TV/Mobile"}
    - {id: 82, cat: TV/Foreign, desc: "TV/Non-English"}
    - {id: 14, cat: TV, desc: "TV/Packs"}
    - {id: 26, cat: TV/SD, desc: "TV/SD/x264"}
    - {id: 7, cat: TV/HD, desc: "TV/x264"}
    - {id: 34, cat: TV/UHD, desc: "TV/x265"}
    - {id: 2, cat: TV/SD, desc: "TV/XviD"}
    - {id: 10, cat: Console, desc: "Nintendo"}
    - {id: 4, cat: PC/Games, desc: "PC/Games"}
    - {id: 18, cat: Console, desc: "PS"}
    - {id: 8, cat: Console, desc: "PSP"}
    - {id: 9, cat: Console, desc: "Xbox"}
    - {id: 17, cat: Audio/MP3, desc: "Music/Audio"}
    - {id: 27, cat: Audio, desc: "Music/Flac"}
    - {id: 23, cat: Audio/Foreign, desc: "Music/Non-English"}
    - {id: 41, cat: Audio, desc: "Music/Packs"}
    - {id: 16, cat: Audio/Video, desc: "Music/Video"}
    - {id: 29, cat: TV/Anime, desc: "Anime"}
    - {id: 42, cat: Audio/Audiobook, desc: "Audio Books"}
    - {id: 20, cat: Books, desc: "Books"}
    - {id: 102, cat: Books/Foreign, desc: "Books/Non-English"}
    - {id: 30, cat: TV/Documentary, desc: "Documentary"}
    - {id: 95, cat: TV/Documentary, desc: "Educational"}
    - {id: 47, cat: Other, desc: "Fonts"}
    - {id: 43, cat: PC/Mac, desc: "Mac"}
    - {id: 45, cat: Audio, desc: "Podcast"}
    - {id: 28, cat: PC, desc: "Softwa/Packs"}
    - {id: 12, cat: PC, desc: "Software"}
    - {id: 19, cat: XXX, desc: "XXX/0Day"}
    - {id: 6, cat: XXX, desc: "XXX/Movies"}
    - {id: 15, cat: XXX, desc: "XXX/Packs"}
  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q, imdbid]
settings:
  - name: cookie
    type: text
    label: Cookie (de tu navegador, sesión logueada)
    required: true
search:
  headers:
    Cookie: "{{ .Config.cookie }}"
  paths:
    - path: t.json
      method: get
      response:
        type: json
      inputs:
        # $raw: fragmento de query string tal cual (TorrentDay usa ";" como
        # separador: t.json?1;2;3;7;q=<query> — no es form-urlencoded).
        $raw: "1;2;3;7;q={{ .Keywords }}"
  rows:
    selector: ""
  fields:
    torrentid:
      selector: t
    title:
      selector: name
    size:
      selector: size
    seeders:
      selector: seeders
    leechers:
      selector: leechers
    date:
      selector: ctime
    download:
      text: "download.php/{{ .Result.torrentid }}/{{ .Result.torrentid }}.torrent"