    - {id: 20, cat: Movies/HD, desc: "Filme / 720p"}
    - {id: 10, cat: Movies/SD, desc: "Filme / SD"}
    - {id: 43, cat: TV/UHD, desc: "Serien / 2160p"}
    - {id: 53, cat: TV/HD, desc: "Serien / 1080p"}
    - {id: 54, cat: TV/HD, desc: "Serien / 720p"}
    - {id: 15, cat: TV/SD, desc: "Serien / SD"}
    - {id: 30, cat: TV/Sport, desc: "Serien / Sport"}
    - {id: 44, cat: TV/UHD, desc: "Serienpacks / 2160p"}
    - {id: 55, cat: TV/HD, desc: "Serienpacks / 1080p"}
    - {id: 56, cat: TV/HD, desc: "Serienpacks / 720p"}
    - {id: 27, cat: TV/SD, desc: "Serienpacks / SD"}
    - {id: 24, cat: Audio/Lossless, desc: "Audio / Musik / FLAC"}
    - {id: 25, cat: Audio/MP3, desc: "Audio / Musik / MP3"}
