    - {id: 18, cat: Audio/Audiobook, desc: "Audio / aBooks"}
    - {id: 33, cat: Audio/Video, desc: "Audio / Videos"}
    - {id: 17, cat: Books, desc: "Misc / eBooks"}
    - {id: 5, cat: PC/Mobile, desc: "Misc / Mobile"}
    - {id: 39, cat: Other, desc: "Misc / Bildung"}
    - {id: 36, cat: TV/Foreign, desc: "Englisch / Serien"}
    - {id: 57, cat: TV/Foreign, desc: "Englisch / Serienpacks"}
    - {id: 37, cat: Movies/Foreign, desc: "Englisch / Filme"}
    - {id: 47, cat: Books, desc: "Englisch / eBooks"}
    - {id: 48, cat: Other, desc: "Englisch / Bildung"}
    - {id: 49, cat: TV/Sport, desc: "Englisch / Sport"}
  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q, imdbid]
settings:
  - name: apikey
    type: password
    label: API Key (de keymgm/keys.php, scopes download+browse)
    required: true
search:
  paths:
    - path: api_9djWe8Tb2NE3p6opyqnh/v1/browse.php
      method: get
      response:
        type: json
      inputs:
        apikey: "{{ .Config.apikey }}"
        limit: "50"
        ponly: "false"
        searchstring: "{{ .Keywords }}"
  rows:
    selector: rows
  fields:
    torrentid:
      selector: id
    title:
      selector: name
    size:
      selector: size
    seeders:
      selector: seeders
    leechers:
      selector: leechers
    date:
      selector: added
    download:
      text: "download.php?id={{ .Result.torrentid }}"